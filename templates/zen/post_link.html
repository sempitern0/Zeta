<style>
  .post-item {
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
    padding: 0.4rem 0.6rem;
    border-radius: 4px;
    list-style: none;
    transition:
      background-color 0.15s ease,
      transform 0.15s ease;
  }

  .post-item:hover {
    background-color: var(--surface);
  }

  .post-date {
    color: var(--text-muted);
    font-size: 0.85em;
    font-family: var(--font-mono);
    white-space: nowrap;
    opacity: 0.8;
  }

  .post-link {
    color: var(--accent-cyan);
    text-decoration: none;
    font-weight: 500;
    transition:
      color 0.15s ease,
      padding-left 0.15s ease;
  }

  .post-item:hover .post-link {
    color: var(--accent);
  }

  .post-link::before {
    content: "> ";
    color: var(--text-muted);
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .post-item:hover .post-link::before {
    opacity: 1;
    color: var(--accent);
  }
</style>

<li class="post-item">
  <span class="post-date">[$date$]</span>
  <a href="$base_url$/$path$" class="post-link">$title$</a>
</li>

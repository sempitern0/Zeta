<!doctype html>
<html lang="$site_lang$">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>$title$ — $site_title$</title>
    <meta name="description" content="$description$">
    <meta name="author" content="$author$">
    <meta name="generator" content="Zeta + Pandoc">
    <style>
$styles.html()$
    </style>
    $for(css)$
    <link rel="stylesheet" href="$css$">
    $endfor$
  </head>
  <body id="top">
    <a class="skip-link" href="#content">Skip to content</a>

    <header class="site-header">
      <div class="header-container">
        <a href="$rel_root$index.html" class="site-title">$site_title$</a>
        <nav class="site-nav" aria-label="Primary navigation">$if(page_navigation)$$page_navigation$$else$
          <a href="$rel_root$index.html">Home</a>
          <a href="$rel_root$posts.html">Posts</a>
        $endif$</nav>
      </div>
    </header>

    <main id="content" class="container">
      <article>
        <header class="article-header">
          <h1 class="article-title">$title$</h1>
          <div class="article-meta">
            <span class="meta-author">$author$</span>
            <span aria-hidden="true"> · </span>
            <time datetime="$iso_date$">$date$</time>
            $if(tags)$
            <div class="article-tags" aria-label="Tags">
              $for(tags)$<span class="tag">#$tags$</span>$endfor$
            </div>
            $endif$
          </div>
        </header>

        $if(toc)$
        <nav class="article-toc" aria-label="Table of contents">$toc$</nav>
        $endif$

        <div class="article-body">$body$</div>
      </article>
    </main>

    <footer class="site-footer">
      <p><a href="#top">Back to top</a></p>
    </footer>
  </body>
</html>

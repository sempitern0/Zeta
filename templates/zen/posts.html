<!doctype html>
<html lang="$site_lang$">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Posts — $site_title$</title>
    <meta name="description" content="$site_desc$">
    $for(css)$
    <link rel="stylesheet" href="$css$">
    $endfor$
  </head>
  <body id="top">
    <a class="skip-link" href="#content">Skip to content</a>

    <header class="site-header">
      <div class="header-container">
        <a href="./index.html" class="site-title">$site_title$</a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="./index.html">Home</a>
          <a href="./posts.html" aria-current="page">Posts</a>
        </nav>
      </div>
    </header>

    <main id="content" class="container">
      <section aria-labelledby="all-posts">
        <h1 id="all-posts">All posts</h1>
        <p class="archive-description">All published Markdown entries.</p>
        <ul class="post-list">
          $posts_list$
        </ul>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; $site_author$ · Built with Zeta.</p>
    </footer>
  </body>
</html>

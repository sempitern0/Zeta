<!doctype html>
<html lang="$site_lang$">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title$ :: $site_title$</title>
  <meta name="description" content="$description$">
  <meta name="author" content="$author$">
  <meta name="generator" content="Zeta + Pandoc">
  <style>
$styles.html()$
  </style>
  $for(css)$<link rel="stylesheet" href="$css$">$endfor$
</head>
<body id="top">
  <a class="skip-link" href="#content">Skip to content</a>

  <header class="console-bar">
    <div class="console-shell console-bar-inner">
      <a class="console-brand" href="$rel_root$index.html"><span aria-hidden="true">root@zeta:~&#36;</span> $site_title$</a>
      <nav class="console-nav" aria-label="Primary navigation">
        <a href="$rel_root$index.html">./home</a>
        <a href="$rel_root$posts.html">./posts</a>
      </nav>
    </div>
  </header>

  <main id="content" class="console-shell console-article-shell">
    <article class="console-article">
      <header class="article-header console-article-header">
        <div class="status-line"><span class="status-dot" aria-hidden="true"></span><span>read-only</span></div>
        <p class="console-prompt" aria-hidden="true">&#36; less $slug$.md</p>
        <h1 class="article-title">$title$</h1>
        <div class="article-meta">
          <span>author=$author$</span>
          <time datetime="$iso_date$">date=$date$</time>
          $if(tags)$<div class="article-tags">$for(tags)$<span class="tag">#$tags$</span>$endfor$</div>$endif$
        </div>
      </header>

      $if(toc)$
      <nav class="article-toc" aria-label="Table of contents">
        <strong>TABLE_OF_CONTENTS</strong>
        $toc$
      </nav>
      $endif$

      <div class="article-body">$body$</div>
    </article>
  </main>

  <footer class="console-footer">
    <div class="console-shell">
      <a href="#top">[top]</a>
      <a href="$rel_root$posts.html">[archive]</a>
      <span>exit=0</span>
    </div>
  </footer>
</body>
</html>

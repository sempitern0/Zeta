name: PowerShell parity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Pandoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install pandoc -y --no-progress
          Add-Content $env:GITHUB_PATH 'C:\Program Files\Pandoc'
      - name: Install Pandoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Check PowerShell syntax and run smoke tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(Get-ChildItem ./lib/powershell/*.ps1) + @(Get-ChildItem ./tests/*.ps1) + @(Get-Item ./zeta.ps1)
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw "Invalid PowerShell syntax: $($script.FullName): $($parseErrors -join '; ')" }
          }
          foreach ($test in (Get-ChildItem ./tests/*-smoke.ps1 | Sort-Object Name)) {
            Write-Host "Running $($test.Name)"
            & $test.FullName
            if (-not $?) { throw "Test failed: $($test.Name)" }
          }
